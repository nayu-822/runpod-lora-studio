[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "runpod-lora-studio"
version = "0.1.0"
description = "RunPod-hosted Gradio app for SDXL LoRA dataset and training workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "nayu-822" },
]
dependencies = [
  "alembic>=1.13.0,<2.0.0",
  "gradio>=5.0.0,<6.0.0",
  "ImageHash>=4.3.1,<5.0.0",
  "Pillow>=10.4.0,<12.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.5.0,<3.0.0",
  "SQLAlchemy>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0,<2.0.0",
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.6.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/runpod_lora_studio"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "scripts"]
extend-exclude = [
  ".agents",
  ".git",
  ".uv-cache",
  ".venv",
  ".pytest-tmp",
  "pytest-cache-files-*",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["runpod_lora_studio"]
strict = true
warn_unused_configs = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["gradio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["imagehash"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
