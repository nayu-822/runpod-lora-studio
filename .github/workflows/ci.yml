name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUNPOD_LORA_STUDIO_WORKSPACE_ROOT: ${{ runner.temp }}/runpod-lora-studio
      RUNPOD_LORA_STUDIO_PROJECTS_DIR: ${{ runner.temp }}/runpod-lora-studio/projects
      RUNPOD_LORA_STUDIO_MODELS_DIR: ${{ runner.temp }}/runpod-lora-studio/models
      RUNPOD_LORA_STUDIO_OUTPUTS_DIR: ${{ runner.temp }}/runpod-lora-studio/outputs
      RUNPOD_LORA_STUDIO_LOGS_DIR: ${{ runner.temp }}/runpod-lora-studio/logs
      RUNPOD_LORA_STUDIO_TEMP_DIR: ${{ runner.temp }}/runpod-lora-studio/tmp
      RUNPOD_LORA_STUDIO_DATABASE_PATH: ${{ runner.temp }}/runpod-lora-studio/database/ldts.sqlite3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest
